server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression : le bundle Angular passe de ~1 Mo a ~250 Ko sur le reseau.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API : tout ce qui commence par /api est transmis au backend Spring ---
    # Le "/" final de proxy_pass retire le prefixe /api : le navigateur appelle
    # /api/auth/connexion, le backend recoit /auth/connexion. Meme origine pour
    # le navigateur => aucun pre-vol CORS.
    location /api/ {
        proxy_pass http://assoue-backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload de photo de signalement : 10 Mo cote Spring (multipart.max-file-size),
        # on laisse la meme marge ici sinon Nginx renvoie 413 avant d'atteindre l'appli.
        client_max_body_size 12m;

        # Geocodage Nominatim appele par le backend : peut etre lent (1 req/s).
        proxy_read_timeout 60s;
    }

    # --- Fichiers hashes par Angular (main-XXXX.js) : immuables, cache long ---
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA : toute autre URL (/produits, /admin/commandes, ...) renvoie
    # index.html, sinon un rafraichissement (F5) sur une route Angular donne 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
