spring.application.name=assoue-backend
server.port=8080

# --- Base H2 en memoire (dev/formation) : une seule base pour toute l'application ---
spring.datasource.url=jdbc:h2:mem:assouedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Ne jamais mettre a true en production : expose la console H2 (sans effet des que
# SPRING_DATASOURCE_URL pointe vers Postgres, mais autant la desactiver par defaut).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# --- Postgres (production) : decommenter et fournir les identifiants via variables d'env ---
#spring.datasource.url=jdbc:postgresql://localhost:5432/assoue_db
#spring.datasource.username=${DB_USERNAME:postgres}
#spring.datasource.password=${DB_PASSWORD:postgres}
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Swagger : une seule documentation pour toute l'API ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- JWT ---
jwt.secret=${JWT_SECRET:CHANGE_MOI_secret_partage_assoue_store_2026_min_32_car}
jwt.expiration=86400000

# --- Cle de chiffrement des donnees personnelles au repos (nom, telephone) -- exigence CIL Burkina Faso, CDC 3B ---
# NE JAMAIS reutiliser CHANGE_MOI en production ; generer une cle aleatoire forte et la garder secrete
# (perdre cette cle rend nom/telephone irrecuperables ; la changer invalide tous les comptes existants).
data.encryption-key=${DATA_ENCRYPTION_KEY:CHANGE_MOI_cle_chiffrement_donnees_perso_2026}

# --- Cle de signature du webhook operateur (Orange Money / Moov Money) ---
# A remplacer par la cle reelle fournie par chaque operateur lors de l'integration (cf. CDC 3A).
payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:CHANGE_MOI_secret_webhook_orange_moov_2026}

# --- CORS : origines autorisees a appeler l'API depuis un navigateur ---
# "ng serve" (frontend Angular en dev) ecoute par defaut sur 4200. Ajouter les
# autres origines (production) via la variable d'environnement, separees par
# des virgules, ex: CORS_ALLOWED_ORIGINS=https://app.assoue.bf,https://admin.assoue.bf
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Actuator (healthcheck Docker) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Stockage des photos de signalement (sur disque, pas en base -- voir FONCTIONNEMENT.md) ---
# En Docker, ce chemin est un volume monte (persiste entre redemarrages du conteneur).
photos.storage-path=${PHOTOS_STORAGE_PATH:./data/photos-signalements}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Geocodage OpenStreetMap (Nominatim) -- voir FONCTIONNEMENT.md ---
# Instance publique gratuite par defaut ; passer a un fournisseur paye (LocationIQ,
# Geoapify, Mapbox) si le volume de requetes devient important (limite a 1 req/s ici).
geocoding.nominatim-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
# OBLIGATOIRE par la politique d'usage de Nominatim : identifie l'application, avec un
# contact valide -- a adapter avant la mise en production (cf. https://operations.osmfoundation.org/policies/nominatim/).
geocoding.user-agent=${GEOCODING_USER_AGENT:AssoueStore/1.0 (contact@assoue.bf)}
